name: firma_tap
description: "Aplicación de firmas para Ecomputer."
publish_to: 'none'
version: 0.0.9+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  signature: ^6.3.0
  shared_preferences: ^2.2.2
  image: ^4.1.3
  package_info_plus: ^4.1.0
  flutter_animate: ^4.5.0
  # --- Potencia: offline, seguridad, pdf, geolocalización, share, charts ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.6
  pdfx: ^2.7.0
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  fl_chart: ^0.71.0
  workmanager: ^0.6.0
  pinput: ^5.0.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  # --- Enterprise ---
  google_mlkit_text_recognition: ^0.14.0
  speech_to_text: ^7.0.0
  google_maps_flutter: ^2.12.1
  sentry_flutter: ^8.14.2
  firebase_remote_config: ^5.4.1
  tflite_flutter: ^0.11.0
  freerasp: ^6.1.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/login_banner.png
    - assets/ml/morosidad.tflite
    - assets/certs/pirineos.pem